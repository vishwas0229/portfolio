name: Portfolio CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          for file in netlify/functions/*.js; do
            node --check "$file"
          done
          for file in netlify/functions/_shared/*.js; do
            node --check "$file"
          done

      - name: Run backend tests
        run: npm test

      - name: Validate site metadata and deployment files
        run: node scripts/validate-site.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Start Docker stack
        run: docker compose up -d --build

      - name: Verify MySQL schema
        run: |
          docker compose exec -T db mysql -uportfolio -pportfolio_dev portfolio -e "SHOW TABLES;"
          docker compose exec -T db mysql -uportfolio -pportfolio_dev portfolio -e "SELECT COUNT(*) AS projects FROM projects;"
          docker compose exec -T db mysql -uportfolio -pportfolio_dev portfolio -e "SELECT COUNT(*) AS certificates FROM certificates;"
          docker compose exec -T db mysql -uportfolio -pportfolio_dev portfolio -e "SELECT COUNT(*) AS admins FROM admins WHERE role='admin' AND active=TRUE AND session_version >= 1;"

      - name: Verify application health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8888/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify public project API
        run: curl --fail --silent http://127.0.0.1:8888/api/projects

      - name: Verify admin account route
        run: |
          status=$(curl --silent --output /tmp/admin-account.json --write-out "%{http_code}" http://127.0.0.1:8888/api/admin/account)
          test "$status" = "401"
          grep -q '"authenticated":false' /tmp/admin-account.json

      - name: Build application image
        run: docker build --tag rahul-portfolio:test .

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
