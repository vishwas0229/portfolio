services:
  db:
    image: mysql:8.4.11
    container_name: rahul-portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio}
      MYSQL_USER: ${MYSQL_USER:-portfolio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfolio_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_change_me}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/mysql-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-portfolio} -p${MYSQL_PASSWORD:-portfolio_dev} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rahul-portfolio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8888

      PORTFOLIO_SITE_URL: http://localhost:8888
      CORS_ORIGIN: http://localhost:8888
      COOKIE_SECURE: "false"

      GITHUB_USERNAME: vishwas0229
      LEETCODE_USERNAME: vishwas0229

      DATABASE_URL: mysql://${MYSQL_USER:-portfolio}:${MYSQL_PASSWORD:-portfolio_dev}@db:3306/${MYSQL_DATABASE:-portfolio}
      DB_POOL_MAX: "10"

      GITHUB_CACHE_TTL_SECONDS: "300"
      LEETCODE_CACHE_TTL_SECONDS: "300"
      API_CACHE_STALE_SECONDS: "3600"
      API_RATE_LIMIT_WINDOW_SECONDS: "60"
      API_RATE_LIMIT_MAX: "60"

      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-docker-local-admin-session-secret-change-me-please-32chars}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-1800}

    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8888/api/health?deep=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql_data:
